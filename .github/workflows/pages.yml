name: Publish p(doom)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Encounter and the dossier
        run: |
          node --test applications/pdoom-encounter/challenge.test.mjs
          node verification/verify/verify_ai_alignment_risk_algebra.mjs
      - name: Compile and assemble the expedition
        run: node --input-type=module -e "import('./applications/pdoom-encounter/build.mjs').then(({build}) => build())"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: applications/pdoom-encounter/.build/site
      - uses: actions/deploy-pages@v4
        id: deployment
